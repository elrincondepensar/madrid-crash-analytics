# Conda environment for madrid-road-safety.
# Reproduce with: conda env create -f environment.yml
name: sendai
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy>=1.26,<2.0
  - pandas>=2.0,<3.0
  - scipy>=1.11
  - scikit-learn>=1.7,<2.0
  - statsmodels>=0.14
  - pyarrow>=15.0
  - geopandas>=0.14
  - shapely>=2.0
  - pyproj>=3.6
  - libpysal>=4.10
  - esda>=2.5
  - hdbscan>=0.8.33
  - lightgbm>=4.0
  - catboost>=1.2
  - requests>=2.31
  - lxml>=5.0
  - openpyxl>=3.1
  - osmnx>=1.9
  - matplotlib>=3.8
  - joblib>=1.3
  - pytest>=8.0
  - pymc>=5.10
  - pymc-bart>=0.6
  - imblearn>=0.12
